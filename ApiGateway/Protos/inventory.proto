syntax = "proto3";

option csharp_namespace = "InventoryGrpc.Protos";

package inventory;

service InventoryService {
  rpc CreateInventory(CreateRequest) returns (BoolReply);
  rpc GetAllInventory(EmptyRequest) returns (InventoryList);
}

//message
message CreateRequest {
	string productId = 1;
	int32 quantityInStock = 2;
}

message BoolReply {
	bool success = 1;
}

message EmptyRequest {}

message InventoryDto {
	string id = 1;
	string productId = 2;
	int32 quantityInStock = 3;
}

message InventoryList {
	repeated InventoryDto items = 1;
}